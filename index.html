<!DOCTYPE html>
<html lang="ar">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ABC Stili Planlama</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="todo-container">
		<h1>ABC Stili Planlama</h1>
		<p class="motivation-message">"Sabret! Senin sabrın ancak Allah’ın yardımı iledir..." (16/Nahl,127)</p>
		<div class="view-controls">
			<button type="button" id="background-change-button" class="background-change-button">Arka plan değiştir</button>
			<button type="button" id="sound-change-button" class="sound-change-button" aria-pressed="false">Focus: Kapalı</button>
		</div>

		<p class="empty-input-message" id="empty-input-message" role="alert" hidden>
			<span aria-hidden="true">🙂</span>
			Boşluğun bir iş olması için astronot olmalısın.
		</p>

		<div class="todo-columns">
			<section class="todo-column" data-column="A">
				<h2>A</h2>
				<form class="todo-form">
					<input type="text" class="todo-input" placeholder="Bir görev yazın" aria-label="A kolonu görevi">
					<button type="submit">Ekle</button>
				</form>
				<ul class="todo-list"></ul>
			</section>

			<section class="todo-column" data-column="B">
				<h2>B</h2>
				<form class="todo-form">
					<input type="text" class="todo-input" placeholder="Bir görev yazın" aria-label="B kolonu görevi">
					<button type="submit">Ekle</button>
				</form>
				<ul class="todo-list"></ul>
			</section>

			<section class="todo-column" data-column="C">
				<h2>C</h2>
				<form class="todo-form">
					<input type="text" class="todo-input" placeholder="Bir görev yazın" aria-label="C kolonu görevi">
					<button type="submit">Ekle</button>
				</form>
				<ul class="todo-list"></ul>
			</section>
		</div>

		<section class="task-chart-section" aria-labelledby="task-chart-title">
			<h2 id="task-chart-title">Bekleyen görevler</h2>
			<div class="task-chart-content">
				<div class="task-chart" id="task-chart" role="img" aria-label="0 tamamlanmamış görev">
					<strong id="task-chart-total">0</strong>
					<span>görev</span>
				</div>
				<ul class="task-chart-legend" id="task-chart-legend" aria-label="Görev sütunları"></ul>
			</div>
		</section>

		<div class="task-summary">
			<div class="task-summary-status">
				<div class="list-actions">
					<button type="button" class="clear-all-button" id="clear-all-button" aria-label="Tümünü sil" title="Tümünü sil"><span class="trash-icon" aria-hidden="true"></span></button>
				</div>
				<p class="todo-count" id="todo-count" aria-live="polite">Toplam görev: 0</p>
			</div>

			<section class="personal-note" aria-labelledby="personal-note-title">
				<div class="personal-note-heading">
					<h2 id="personal-note-title">Kendime not</h2>
					<span aria-hidden="true">✦</span>
				</div>
				<textarea id="personal-note-input" class="personal-note-input" rows="3" placeholder="Bugün kendine hatırlatmak istediğin şeyi buraya yaz..." aria-label="Kendime not" readonly></textarea>
				<button type="button" id="personal-note-button" class="personal-note-button"><span class="pencil-icon" aria-hidden="true"></span><span class="button-label">Düzenle</span></button>
			</section>
		</div>
	</main>

	<script src="script.js"></script>
</body>
</html>
